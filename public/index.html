<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Disaster Response Hub</title>
<meta name="description" content="From Distress Signal to Rescue in 60 Seconds" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon">🆘</span>
    <div>
      <h1>AI Disaster Response Hub</h1>
      <p class="tagline">From Distress Signal to Rescue in 60 Seconds</p>
    </div>
  </div>
  <button id="sosBtn" class="sos-btn">🚨 Send SOS</button>
</header>

<main class="layout">
  <div id="map"></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Active Reports</h2>
      <span id="reportCount" class="count-badge">0</span>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="in-progress">In Progress</button>
      <button class="filter-btn" data-filter="resolved">Resolved</button>
    </div>
    <div id="reportList" class="report-list"></div>
  </aside>
</main>

<!-- SOS Modal -->
<div id="sosModal" class="modal hidden">
  <div class="modal-content">
    <h2>Report an Emergency</h2>
    <p class="modal-sub">Your live location will be attached automatically.</p>

    <label>Disaster Type</label>
    <select id="disasterType">
      <option value="flood">Flood</option>
      <option value="earthquake">Earthquake</option>
      <option value="fire">Fire</option>
      <option value="other">Other</option>
    </select>

    <label>Description</label>
    <textarea id="disasterDesc" rows="3" placeholder="What's happening? How many people affected?"></textarea>

    <label>Contact Number (optional)</label>
    <input id="disasterContact" type="text" placeholder="e.g. 0300-1234567" />

    <div id="locationStatus" class="location-status">📍 Getting your location...</div>

    <div class="modal-actions">
      <button id="cancelSos" class="btn-secondary">Cancel</button>
      <button id="confirmSos" class="btn-primary" disabled>Send SOS</button>
    </div>
  </div>
</div>

<!-- Report Detail Modal -->
<div id="detailModal" class="modal hidden">
  <div class="modal-content">
    <div class="detail-header">
      <span id="detailType" class="badge"></span>
      <span id="detailStatus" class="badge"></span>
    </div>
    <p id="detailDesc"></p>
    <p class="meta" id="detailMeta"></p>

    <div class="status-actions">
      <label>Update status (rescuer view):</label>
      <select id="statusSelect">
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="resolved">Resolved</option>
      </select>
    </div>

    <h3>Updates</h3>
    <div id="commentThread" class="comment-thread"></div>
    <div class="comment-input">
      <input id="commentText" type="text" placeholder="Post an update..." />
      <button id="postComment">Send</button>
    </div>

    <div class="modal-actions">
      <button id="closeDetail" class="btn-secondary">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
